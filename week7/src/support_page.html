<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TooManyRules — поддержка</title>
<style>
:root{color-scheme:light;--ink:#182d34;--muted:#536a70;--line:#cedbd8;--green:#176552;--paper:#fffefa;--wash:#eef3ef;--mine:#dcefe4}
*{box-sizing:border-box}
body{margin:0;background:var(--wash);color:var(--ink);font:16px/1.5 system-ui,sans-serif;display:flex;flex-direction:column;min-height:100vh}
header{padding:18px 24px;background:var(--ink);color:white}
h1{font-size:23px;margin:0;font-weight:650;letter-spacing:-.5px}
header p{margin:3px 0 0;color:#bed3cc;font-size:14px}
main{flex:1;width:100%;max-width:920px;margin:0 auto;padding:16px;display:flex;flex-direction:column;gap:12px;min-height:0}
.bar{display:flex;gap:10px;align-items:end;flex-wrap:wrap;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.bar label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.bar .field{flex:1;min-width:220px}
input,textarea,button{font:inherit}
input,textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:white;color:var(--ink)}
button{border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:9px 14px;cursor:pointer}
button:hover{border-color:var(--green)}
button:disabled{cursor:wait;opacity:.55}
.primary{background:var(--green);color:white;border-color:var(--green);font-weight:600}
#log{flex:1;overflow:auto;display:flex;flex-direction:column;gap:12px;padding:4px 2px;min-height:300px;max-height:calc(100vh - 330px)}
.note{align-self:center;font-size:13px;color:var(--muted);background:var(--paper);border:1px dashed var(--line);border-radius:20px;padding:4px 12px;text-align:center}
.msg{max-width:85%;border-radius:14px;padding:12px 15px;white-space:pre-wrap;overflow-wrap:anywhere}
.mine{align-self:flex-end;background:var(--mine);border-bottom-right-radius:4px}
.bot{align-self:flex-start;background:var(--paper);border:1px solid var(--line);border-bottom-left-radius:4px;font-size:17px;line-height:1.55}
.error{align-self:flex-start;color:#a42f2b;background:#fbecea;border:1px solid #efc6c1}
.sources{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);font-size:13px;color:var(--muted);white-space:normal}
.sources p{margin:3px 0}
.warning{color:#845115}
details{margin-top:8px;font-size:13px;white-space:normal}
summary{cursor:pointer;color:var(--muted)}
details pre{white-space:pre-wrap;overflow-wrap:anywhere;font:13px/1.45 ui-monospace,monospace;margin:8px 0 0;max-height:320px;overflow:auto;color:var(--ink)}
form{display:flex;gap:10px;align-items:end;background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
#question{height:64px;min-height:48px;resize:vertical;font-size:16px}
.send{display:flex;flex-direction:column;gap:6px;align-items:stretch}
#progress{font-size:13px;color:var(--muted);min-height:18px;text-align:center}
#health{font-size:12px;color:var(--muted);text-align:center;margin:0 0 10px}
:focus-visible{outline:3px solid #b3c9a7;outline-offset:2px}
@media(max-width:640px){.msg{max-width:95%}#log{max-height:none}form{flex-direction:column;align-items:stretch}}
</style>
</head>
<body>
<header><h1>TooManyRules — поддержка</h1><p>Задайте вопрос о работе приложения</p></header>
<main>
<div class="bar">
  <div class="field"><label for="who">Номер обращения или id клиента (необязательно)</label><input id="who" autocomplete="off" placeholder="например, T-1042 или U-001; пусто — общий вопрос"></div>
  <button id="reset" type="button">Новый разговор</button>
</div>
<section id="log" aria-live="polite" aria-label="Переписка"></section>
<form id="ask">
  <textarea id="question" aria-label="Вопрос" placeholder="Ваш вопрос… (Enter — отправить, Shift+Enter — новая строка)"></textarea>
  <div class="send"><button id="send" class="primary" type="submit">Отправить</button><span id="progress" role="status"></span></div>
</form>
</main>
<p id="health"></p>
<script>
'use strict';
const HISTORY_MESSAGES = 6;
const el = id => document.getElementById(id);
let history = [], conversationWho = null, busy = false;

function whoValue() {
  return el('who').value.trim();
}

function scrollDown() {
  // Прокручивается только переписка, а не вся страница.
  el('log').scrollTop = el('log').scrollHeight;
}

function add(tag, className, text) {
  const node = document.createElement(tag);
  node.className = className;
  node.textContent = text;
  el('log').append(node);
  scrollDown();
  return node;
}

function reset() {
  // Ответы прежнего клиента не должны уйти в историю другого.
  history = [];
  conversationWho = whoValue();
  el('log').replaceChildren();
  add('div', 'note', conversationWho ? 'Ответы учитывают данные CRM: ' + conversationWho : 'Общий вопрос: данные CRM не используются');
}

function details(data) {
  const block = document.createElement('details');
  const summary = document.createElement('summary');
  summary.textContent = 'Подробности';
  const pre = document.createElement('pre');
  const excerpts = data.excerpts.map(e =>
    '[' + e.n + '] ' + e.kind + ' · ' + e.label + ' · оценка ' + (e.score == null ? '—' : e.score.toFixed(3)) + ' · до реранка #' + e.rank
  ).join('\n');
  const calls = data.tool_calls.map(c =>
    c.name + ' ' + JSON.stringify(c.arguments) + ' · ' + (c.ok ? 'готово' : 'ошибка')
  ).join('\n') || 'нет';
  pre.textContent = data.crm + '\n' + data.stats + '\n\nЗапрос поиска:\n' + data.query +
    '\n\nВыдержки:\n' + excerpts + '\n\nВызовы инструментов моделью:\n' + calls;
  block.append(summary, pre);
  return block;
}

function showAnswer(data) {
  const message = add('div', 'msg bot', data.answer);
  const sources = document.createElement('div');
  sources.className = 'sources';
  if (data.sources.length) {
    const title = document.createElement('p');
    title.textContent = 'Источники:';
    sources.append(title);
  }
  for (const source of data.sources) {
    const line = document.createElement('p');
    line.textContent = '[' + source.n + '] ' + source.label;
    sources.append(line);
  }
  for (const warning of data.warnings) {
    const line = document.createElement('p');
    line.className = 'warning';
    line.textContent = warning;
    sources.append(line);
  }
  sources.append(details(data));
  message.append(sources);
  scrollDown();
}

function controls() {
  el('send').disabled = busy;
  el('reset').disabled = busy;
  el('who').disabled = busy;
}

async function send() {
  const question = el('question').value.trim();
  if (busy || !question) return;
  if (whoValue() !== conversationWho) reset();
  busy = true;
  controls();
  add('div', 'msg mine', question);
  el('question').value = '';
  const start = Date.now();
  const tick = () => { el('progress').textContent = 'ассистент отвечает… ' + Math.floor((Date.now() - start) / 1000) + ' с'; };
  tick();
  const timer = setInterval(tick, 1000);
  try {
    const response = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({who: conversationWho || null, question, history: history.slice(-HISTORY_MESSAGES)})
    });
    let data;
    try { data = await response.json(); } catch { data = {}; }
    if (!response.ok) throw new Error(data.error || 'Ошибка ' + response.status);
    showAnswer(data);
    history.push({role: 'user', content: question}, {role: 'assistant', content: data.answer});
  } catch (error) {
    // Вопрос возвращается в поле, чтобы отправить заново; в историю ошибка не попадает.
    add('div', 'msg error', error.message);
    el('question').value = question;
  } finally {
    clearInterval(timer);
    el('progress').textContent = '';
    busy = false;
    controls();
    el('question').focus();
  }
}

el('ask').addEventListener('submit', event => { event.preventDefault(); send(); });
el('question').addEventListener('keydown', event => {
  if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
    event.preventDefault();
    send();
  }
});
el('who').addEventListener('change', () => { if (whoValue() !== conversationWho) reset(); });
el('reset').addEventListener('click', reset);
reset();
fetch('/api/health').then(response => response.json()).then(data => {
  el('health').textContent = 'Индекс: ' + data.chunks + ' кусков, FAQ: ' + data.faq_chunks + ' · модель ' + data.model +
    (data.warnings.length ? ' · ⚠️ ' + data.warnings.join(' · ') : '');
}).catch(() => {});
</script>
</body>
</html>
