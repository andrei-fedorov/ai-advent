<!doctype html>
<!--
  TooManyRules — страница чата сервиса дня 30 (`llm_service.py` отдаёт её на `/`).
  Один файл без сборки и внешних библиотек. История разговора живёт в памяти
  вкладки, ключ — в localStorage этого браузера; сервис ни то, ни другое не
  хранит. Текст выводится как текст (textContent), без разметки.
-->
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Локальная модель</title>
<style>
  :root {
    --bg: #f6f6f4; --fg: #1d1d1b; --muted: #6b6b66; --line: #d9d9d4;
    --me: #dfe9f7; --model: #ffffff; --error: #b3261e; --accent: #2b5fb4; --on-accent: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #161615; --fg: #ececea; --muted: #9a9a94; --line: #34342f;
      --me: #22324a; --model: #20201e; --error: #ff8a80; --accent: #8fb4f0; --on-accent: #10213d;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--fg);
    font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; max-width: 760px; margin: 0 auto;
  }
  header, footer { padding: 10px 16px; }
  header { border-bottom: 1px solid var(--line); }
  h1 { font-size: 19px; margin: 0 0 8px; }
  .row { display: flex; gap: 8px; align-items: center; }
  input, textarea, button { font: inherit; color: inherit; }
  input, textarea {
    background: var(--model); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; min-width: 0;
  }
  #key { flex: 1; }
  button {
    background: var(--model); border: 1px solid var(--line); border-radius: 10px; padding: 8px 12px; cursor: pointer;
  }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button:disabled { opacity: .5; cursor: default; }
  #log { flex: 1; overflow-y: auto; padding: 12px 16px; }
  .msg { margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .me { background: var(--me); margin-left: 15%; }
  .model { background: var(--model); border: 1px solid var(--line); margin-right: 5%; }
  .meta { color: var(--muted); font-size: 14px; margin: -8px 0 12px 4px; }
  .error { color: var(--error); font-size: 15px; margin: 0 0 12px 4px; white-space: pre-wrap; }
  .hint { color: var(--muted); font-size: 15px; }
  footer { border-top: 1px solid var(--line); }
  #question { flex: 1; resize: vertical; min-height: 48px; max-height: 40vh; }
  #status { color: var(--muted); font-size: 13px; margin-top: 8px; }
</style>
</head>
<body>
<header>
  <h1>Локальная модель — приватный сервис</h1>
  <div class="row">
    <input id="key" type="password" placeholder="Ключ клиента" autocomplete="off">
    <button id="forget" type="button">Забыть ключ</button>
  </div>
</header>
<main id="log">
  <p class="hint">Разговор хранится только в этой вкладке: сервис его не
  запоминает. Введите ключ и задайте вопрос.</p>
</main>
<footer>
  <div class="row">
    <textarea id="question" rows="2" placeholder="Вопрос"></textarea>
  </div>
  <div class="row" style="margin-top:8px">
    <button id="send" class="primary" type="button">Отправить</button>
    <button id="reset" type="button">Новый разговор</button>
  </div>
  <div id="status">Состояние сервиса…</div>
</footer>
<script>
"use strict";
const KEY_STORAGE = "toomanyrules-service-key";
const keyInput = document.getElementById("key");
const log = document.getElementById("log");
const question = document.getElementById("question");
const sendButton = document.getElementById("send");
const statusLine = document.getElementById("status");
let history = [];   // сообщения разговора — только в памяти страницы

function loadKey() {
  try { return localStorage.getItem(KEY_STORAGE) || ""; } catch (e) { return ""; }
}
function saveKey(value) {
  try { value ? localStorage.setItem(KEY_STORAGE, value) : localStorage.removeItem(KEY_STORAGE); } catch (e) {}
}
keyInput.value = loadKey();
keyInput.addEventListener("change", () => saveKey(keyInput.value.trim()));
document.getElementById("forget").addEventListener("click", () => { keyInput.value = ""; saveKey(""); });

function add(className, text) {
  const node = document.createElement("div");
  node.className = className;
  node.textContent = text;
  log.appendChild(node);
  log.scrollTop = log.scrollHeight;
  return node;
}

function headerText(response, name) {
  const value = response.headers.get(name);
  if (value === null) return null;
  try { return decodeURIComponent(value); } catch (e) { return value; }
}

async function refreshStatus() {
  try {
    const response = await fetch("/health", { cache: "no-store" });
    const data = await response.json();
    const model = data.model ? data.model : "модель не загружена";
    const context = data.context ? `окно ${data.context.toLocaleString("ru-RU")}` : "окно н/д";
    const queue = data.queue ? `в модели ${data.queue.active}, ждут ${data.queue.waiting} из ${data.queue.max}` : "";
    const upstream = data.upstream && data.upstream !== "ok" ? ` · ${data.upstream}` : "";
    statusLine.textContent = `${model} · ${context} · ${queue}${upstream}`;
  } catch (e) {
    statusLine.textContent = "Сервис не отвечает";
  }
}

async function send() {
  const text = question.value.trim();
  const key = keyInput.value.trim();
  if (!text) return;
  if (!key) { add("error", "Введите ключ клиента."); return; }
  saveKey(key);
  const messages = history.concat([{ role: "user", content: text }]);
  add("msg me", text);
  question.value = "";
  sendButton.disabled = true;
  const pending = add("meta", "Ждём ответ…");
  const started = performance.now();
  try {
    const response = await fetch("/v1/chat/completions", {
      method: "POST",
      headers: { "Content-Type": "application/json", "Authorization": `Bearer ${key}` },
      body: JSON.stringify({ model: "local", reasoning_effort: "none", messages }),
    });
    const seconds = ((performance.now() - started) / 1000).toFixed(1);
    let data = null;
    try { data = await response.json(); } catch (e) {}
    pending.remove();
    if (!response.ok) {
      const message = data && data.error && data.error.message ? data.error.message : `Ошибка ${response.status}`;
      add("error", message);
      return;   // сообщение пользователя при ошибке в историю не добавляется
    }
    const answer = data && data.choices && data.choices[0] && data.choices[0].message
      ? (data.choices[0].message.content || "") : "";
    history = messages.concat([{ role: "assistant", content: answer }]);
    add("msg model", answer || "(пустой ответ)");
    const wait = headerText(response, "X-Queue-Wait");
    const usage = data.usage || {};
    const parts = [data.model || "модель н/д", `${seconds} с`];
    if (wait !== null) parts.push(`в очереди ${Number(wait).toFixed(1)} с`);
    if (usage.prompt_tokens !== undefined) parts.push(`токены ${usage.prompt_tokens} + ${usage.completion_tokens}`);
    add("meta", parts.join(" · "));
  } catch (e) {
    pending.remove();
    add("error", `Сервис не отвечает: ${e.message}`);
  } finally {
    sendButton.disabled = false;
    refreshStatus();
  }
}

sendButton.addEventListener("click", send);
question.addEventListener("keydown", (event) => {
  if (event.key === "Enter" && (event.metaKey || event.ctrlKey)) send();
});
document.getElementById("reset").addEventListener("click", () => {
  history = [];
  log.replaceChildren();
  refreshStatus();
});
refreshStatus();
</script>
</body>
</html>
